# ⚡ Bifrost — Build & Push image to ghcr.io
# Polyrepo CI pattern (org-wide standard)
#
# Note: Bifrost's Dockerfile expects a build context with both Bifrost/
# AND Mimir/ro-ai-bridge/ as siblings (Cargo workspace path dep — see
# Bifrost issue #11). Workflow checks out Mimir alongside.

name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: bifrost

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Bifrost (sibling layout)
        uses: actions/checkout@v4
        with:
          path: Bifrost

      - name: Checkout Mimir (cross-repo Cargo dep)
        uses: actions/checkout@v4
        with:
          repository: MegaWiz-Dev-Team/Mimir
          path: Mimir
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Bifrost/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/megawiz-dev-team/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/megawiz-dev-team/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-success:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.build.result }}" != "success" ]; then echo "❌"; exit 1; fi
          echo "✅"
