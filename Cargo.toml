[package]
name = "bifrost"
version = "0.3.0"
edition = "2021"

[dependencies]
axum = "0.8.8"
tokio = { version = "1.49.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rig-core = "0.10.0"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["json", "env-filter", "time"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4.39", features = ["serde"] }
anyhow = "1.0.101"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "postgres", "sqlite", "chrono", "uuid"] }
regex = "1.10.0"
async-trait = "0.1.80"
schemars = "0.8.21"

mimir-core-ai = { path = "../Mimir/ro-ai-bridge/mimir-core-ai" }
memvid-core = { version = "2.0", features = ["lex", "vec"] }
dotenvy = "0.15.7"

# OpenTelemetry for Laminar & Týr Integrations
opentelemetry = { version = "0.21.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.21.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.14.0", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.22.0"

# Yggdrasil JWT validation (ported from Heimdall gateway)
jsonwebtoken = "9"
moka = { version = "0.12", features = ["future"] }

# Rate limiting for /v1/agents*
tower = { version = "0.5", features = ["util"] }
tower_governor = "0.8"

[dev-dependencies]
wiremock = "0.6"
http-body-util = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-test = "0.2"
